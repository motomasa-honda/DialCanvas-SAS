name: Forest Guardian 4-sidewood-anchor / 7-axis retention decision integrity
on:
  pull_request:
    paths:
      - '.github/workflows/anchor-lock-review.yml'
      - 'execution/anchor_lock_2026-10-16/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anchor-lock-review-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preserve immutable firmware baseline
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
      - name: Verify design-contract outcomes, retain failed M2 proposal redline
        run: |
          set -euo pipefail
          python3 -m py_compile execution/anchor_lock_2026-10-16/check_contract.py
          python3 execution/anchor_lock_2026-10-16/check_contract.py | tee execution/anchor_lock_2026-10-16/static-evidence.log
          echo "SOURCE_D7_CAD_RECOMPUTE=NOT_RUN_IN_GITHUB" >> execution/anchor_lock_2026-10-16/static-evidence.log
          echo "NATIVE_M2_MOUNT=REJECTED_RESERVED_ZONE" >> execution/anchor_lock_2026-10-16/static-evidence.log
          echo "SPRING_CLIP=VOLUME_ONLY_NOT_TESTED" >> execution/anchor_lock_2026-10-16/static-evidence.log
      - name: Preserve review snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anchor-lock-review-static-not-hardware
          path: |
            execution/anchor_lock_2026-10-16/contract.json
            execution/anchor_lock_2026-10-16/static-evidence.log
          if-no-files-found: warn
