name: Forest Guardian G1 28 independent output tri-state-disabled channels / 208 TI physical pads
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-28phase-disabled-review.yml'
      - 'execution/g1_28phase_disabled/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-28-phase-driver-outputs-inhibited:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Immutable source firmware archive
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
      - name: TI original octal pinout / 28 outputs are held high impedance with 28 pulldowns
        run: |
          set -euo pipefail
          python3 execution/g1_28phase_disabled/check_contract.py
          python3 execution/preflight.py
