name: Forest Guardian G1-80 release-then-rearm and PG startup latch (review)
on:
  pull_request:
    paths:
      - '.github/workflows/g1-80-startup-interlock-review.yml'
      - 'execution/g1_80_startup_interlock/**'
      - 'execution/g1_79_output_low_screen/**'
      - 'execution/g1_phase77_140pins/**'
      - 'execution/g1_28phase_disabled/**'
      - 'execution/preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-80-independent-review-model-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verified native-register boundary and 14-state-machine tests
        run: |
          set -euo pipefail
          python3 execution/g1_80_startup_interlock/check_contract.py
          python3 execution/preflight.py
