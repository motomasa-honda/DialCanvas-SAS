name: G1-85 TI TPS259474L actual 4 analog pin candidate native KiCad review
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-85-analog-kicad-review.yml'
      - 'execution/g1_85_efuse_analog/**'
      - 'execution/g1_82_integrated_review/pin_map_364.json'
      - 'execution/preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-85-native-pin-verified-but-unapproved:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify 374 source-level physical pin nodes
        run: |
          set -euo pipefail
          python3 execution/g1_85_efuse_analog/check_contract.py
          python3 execution/preflight.py
      - name: Install authentic KiCad9
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Register isolated non-manufacturing pin libraries
        run: |
          set -euo pipefail
          CONF="$HOME/.config/kicad/9.0"
          mkdir -p "$CONF"
          ROOT="$GITHUB_WORKSPACE/execution/g1_85_efuse_analog"
          cat > "$CONF/sym-lib-table" <<EOF
          (sym_lib_table
            (version 7)
            (lib (name "FG_REVIEW")(type "KiCad")(uri "$ROOT/FG_REVIEW.kicad_sym")(options "")(descr "Nonproduction"))
            (lib (name "FG_TI")(type "KiCad")(uri "$ROOT/FG_TI.kicad_sym")(options "")(descr "TI package pinmap"))
          )
          EOF
      - name: Actual KiCad XML/SVG/ERC and electrical net connectivity check
        run: |
          set -euo pipefail
          SRC=execution/g1_85_efuse_analog/forest_guardian_g1_85_analog_review.kicad_sch
          OUT=execution/g1_85_efuse_analog/native_evidence
          mkdir -p "$OUT/svg"
          kicad-cli sch export netlist --format kicadxml -o "$OUT/review.net.xml" "$SRC"
          kicad-cli sch export svg --output "$OUT/svg" "$SRC"
          kicad-cli sch erc --format json --severity-all -o "$OUT/erc.json" "$SRC"
          python3 execution/g1_85_efuse_analog/validate_native_netlist.py "$OUT"
      - name: Save all native outputs including unresolved ERC errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-85-native-kicad9-analog-unapproved-evidence
          path: execution/g1_85_efuse_analog/native_evidence/
          if-no-files-found: warn
