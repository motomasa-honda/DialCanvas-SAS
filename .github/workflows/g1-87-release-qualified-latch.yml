name: Forest Guardian G1-87 physical release-qualified rearm KiCad9 review
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-87-release-qualified-latch.yml'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/g1_86_fault_latch/pin_map_404.json'
      - 'execution/preflight.py'
  workflow_dispatch:
  pull_request:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-87-release-qualified-latch.yml'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/g1_86_fault_latch/pin_map_404.json'
      - 'execution/preflight.py'
permissions:
  contents: read
jobs:
  g1-87-physical-release-first-rearm-unapproved:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify 446 pins and critical held-clear recovery tests
        run: |
          set -euo pipefail
          python3 execution/g1_87_rearm_release/check_contract.py
          python3 execution/preflight.py
      - name: Install actual KiCad9
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: Register physical review symbols for native check
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/execution/g1_87_rearm_release"
          mkdir -p "$HOME/.config/kicad/9.0"
          cat > "$HOME/.config/kicad/9.0/sym-lib-table" <<EOF
          (sym_lib_table
           (version 7)
           (lib (name "FG_REVIEW")(type "KiCad")(uri "$ROOT/FG_REVIEW.kicad_sym")(options "")(descr "No manufacturing"))
           (lib (name "FG_TI")(type "KiCad")(uri "$ROOT/FG_TI.kicad_sym")(options "")(descr "eFuse review"))
           (lib (name "FG_FAULT")(type "KiCad")(uri "$ROOT/FG_FAULT.kicad_sym")(options "")(descr "NOR INV AND"))
           (lib (name "FG_SWITCH")(type "KiCad")(uri "$ROOT/FG_SWITCH.kicad_sym")(options "")(descr "Schmitt buffer"))
          )
          EOF
      - name: Genuine KiCad netlist and ERC; assert all 446 pins
        run: |
          set -euo pipefail
          SRC=execution/g1_87_rearm_release/forest_guardian_g1_87_release_qualified_review.kicad_sch
          OUT=execution/g1_87_rearm_release/native_evidence
          mkdir -p "$OUT/svg"
          kicad-cli sch export netlist --format kicadxml -o "$OUT/native.net.xml" "$SRC"
          kicad-cli sch export svg --output "$OUT/svg" "$SRC"
          kicad-cli sch erc --format json --severity-all -o "$OUT/erc.json" "$SRC"
          python3 execution/g1_87_rearm_release/validate_native_netlist.py "$OUT"
      - name: Archive actual ERC findings, not manufacturing evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-87-real-kicad9-release-qualifier-unapproved
          path: execution/g1_87_rearm_release/native_evidence/
          if-no-files-found: warn
