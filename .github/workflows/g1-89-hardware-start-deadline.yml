name: G1-89 actual TPS3808 hardware startup timer (no motor enable)
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-89-hardware-start-deadline.yml'
      - 'execution/g1_89_hardware_start_deadline/**'
      - 'execution/g1_88_pg_rail_fault/**'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-kicad-startup-deadline-review-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate real G1-89 circuit and assert precise parent differences
        run: |
          set -euo pipefail
          python3 execution/g1_89_hardware_start_deadline/build_review.py
          python3 execution/g1_89_hardware_start_deadline/check_contract.py
          python3 execution/preflight.py
      - name: Install native KiCad9 and four real review symbol libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          ROOT="$GITHUB_WORKSPACE/execution/g1_87_rearm_release"
          G88="$GITHUB_WORKSPACE/execution/g1_88_pg_rail_fault"
          G89="$GITHUB_WORKSPACE/execution/g1_89_hardware_start_deadline"
          mkdir -p "$HOME/.config/kicad/9.0"
          cat > "$HOME/.config/kicad/9.0/sym-lib-table" <<EOF
          (sym_lib_table
           (version 7)
           (lib (name "FG_REVIEW")(type "KiCad")(uri "$ROOT/FG_REVIEW.kicad_sym")(options "")(descr "Review only"))
           (lib (name "FG_TI")(type "KiCad")(uri "$ROOT/FG_TI.kicad_sym")(options "")(descr "eFuse"))
           (lib (name "FG_FAULT")(type "KiCad")(uri "$G88/FG_FAULT.kicad_sym")(options "")(descr "Fault logic"))
           (lib (name "FG_TIMER")(type "KiCad")(uri "$G89/FG_TIMER.kicad_sym")(options "")(descr "TPS3808"))
           (lib (name "FG_SWITCH")(type "KiCad")(uri "$ROOT/FG_SWITCH.kicad_sym")(options "")(descr "Schmitt"))
          )
          EOF
          kicad-cli version
      - name: Actual native KiCad9 XML ERC SVG all 499 pins
        run: |
          set -euo pipefail
          SRC=execution/g1_89_hardware_start_deadline/forest_guardian_g1_89_hardware_start_deadline_review.kicad_sch
          OUT=execution/g1_89_hardware_start_deadline/native_evidence
          mkdir -p "$OUT/svg"
          kicad-cli sch export netlist --format kicadxml -o "$OUT/native.net.xml" "$SRC"
          kicad-cli sch export svg --output "$OUT/svg" "$SRC"
          kicad-cli sch erc --format json --severity-all -o "$OUT/erc.json" "$SRC"
          python3 execution/g1_89_hardware_start_deadline/check_contract.py "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-89-native-tps3808-startup-deadline-review
          path: |
            execution/g1_89_hardware_start_deadline/native_evidence/
            execution/g1_89_hardware_start_deadline/pin_map_499.json
            execution/g1_89_hardware_start_deadline/forest_guardian_g1_89_hardware_start_deadline_review.kicad_sch
          if-no-files-found: warn
