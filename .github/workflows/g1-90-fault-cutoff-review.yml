name: G1-90 actual fault-to-power-and-phase cutoff KiCad REVIEW ONLY
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-90-fault-cutoff-review.yml'
      - 'execution/g1_90_fault_cutoff/**'
      - 'execution/g1_89_hardware_start_deadline/**'
      - 'execution/g1_88_pg_rail_fault/**'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/preflight.py'
  workflow_dispatch:
  pull_request:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-90-fault-cutoff-review.yml'
      - 'execution/g1_90_fault_cutoff/**'
      - 'execution/g1_89_hardware_start_deadline/**'
      - 'execution/g1_88_pg_rail_fault/**'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/preflight.py'
permissions:
  contents: read
jobs:
  g1-90-real-native-kicad-cutoff-stays-disabled:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate real G1-90 from immutable G1-89 and verify cutoff invariants
        run: |
          set -euo pipefail
          python3 execution/g1_90_fault_cutoff/build_review.py
          python3 execution/g1_90_fault_cutoff/check_contract.py
          python3 execution/preflight.py
      - name: Install native KiCad9 and exact review libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          ROOT="$GITHUB_WORKSPACE/execution/g1_87_rearm_release"
          G88="$GITHUB_WORKSPACE/execution/g1_88_pg_rail_fault"
          G89="$GITHUB_WORKSPACE/execution/g1_89_hardware_start_deadline"
          G90="$GITHUB_WORKSPACE/execution/g1_90_fault_cutoff"
          mkdir -p "$HOME/.config/kicad/9.0"
          cat > "$HOME/.config/kicad/9.0/sym-lib-table" <<EOF
          (sym_lib_table
           (version 7)
           (lib (name "FG_REVIEW")(type "KiCad")(uri "$ROOT/FG_REVIEW.kicad_sym")(options "")(descr "Review"))
           (lib (name "FG_TI")(type "KiCad")(uri "$ROOT/FG_TI.kicad_sym")(options "")(descr "eFuse"))
           (lib (name "FG_FAULT")(type "KiCad")(uri "$G88/FG_FAULT.kicad_sym")(options "")(descr "Fault"))
           (lib (name "FG_TIMER")(type "KiCad")(uri "$G89/FG_TIMER.kicad_sym")(options "")(descr "Start timer"))
           (lib (name "FG_CUTOFF")(type "KiCad")(uri "$G90/FG_CUTOFF.kicad_sym")(options "")(descr "Safety sink unpowered"))
           (lib (name "FG_SWITCH")(type "KiCad")(uri "$ROOT/FG_SWITCH.kicad_sym")(options "")(descr "Rearm"))
          )
          EOF
          kicad-cli version
      - name: Real KiCad9 XML netlist, ERC, SVG cross-check 522 source pads
        run: |
          set -euo pipefail
          SRC=execution/g1_90_fault_cutoff/forest_guardian_g1_90_fault_cutoff_review.kicad_sch
          OUT=execution/g1_90_fault_cutoff/native_evidence
          mkdir -p "$OUT/svg"
          kicad-cli sch export netlist --format kicadxml -o "$OUT/native.net.xml" "$SRC"
          kicad-cli sch export svg --output "$OUT/svg" "$SRC"
          kicad-cli sch erc --format json --severity-all -o "$OUT/erc.json" "$SRC"
          python3 execution/g1_90_fault_cutoff/check_contract.py "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-90-genuine-kicad-fault-to-en-and-oe-disabled
          path: |
            execution/g1_90_fault_cutoff/native_evidence/
            execution/g1_90_fault_cutoff/forest_guardian_g1_90_fault_cutoff_review.kicad_sch
            execution/g1_90_fault_cutoff/pin_map_522.json
          if-no-files-found: warn
