name: G1-94 actual 16 dangling labels to native no-connect ERC reduction
on:
  pull_request:
    paths:
      - '.github/workflows/g1-94-native-erc-singletons.yml'
      - 'execution/g1_94_native_erc_cleanup/**'
      - 'execution/g1_93_inhibited_phase_grant/**'
      - 'execution/g1_92_inhibited_start_grant/**'
      - 'execution/g1_91_aon_supervisor/**'
      - 'execution/g1_90_fault_cutoff/**'
      - 'execution/g1_89_hardware_start_deadline/**'
      - 'execution/g1_88_pg_rail_fault/**'
      - 'execution/g1_87_rearm_release/**'
      - 'execution/preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-real-erc-3-power-holds-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce G1-93; prove 16 singleton real NC conversions; run overall preflight
        run: |
          set -euo pipefail
          python3 execution/g1_94_native_erc_cleanup/build_review.py
          python3 execution/g1_94_native_erc_cleanup/check_contract.py
          python3 execution/preflight.py
      - name: Install actual KiCad9 full original review symbol tables
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          ROOT="$GITHUB_WORKSPACE/execution/g1_87_rearm_release"
          G88="$GITHUB_WORKSPACE/execution/g1_88_pg_rail_fault"
          G89="$GITHUB_WORKSPACE/execution/g1_89_hardware_start_deadline"
          G90="$GITHUB_WORKSPACE/execution/g1_90_fault_cutoff"
          mkdir -p "$HOME/.config/kicad/9.0"
          cat > "$HOME/.config/kicad/9.0/sym-lib-table" <<EOF
          (sym_lib_table
           (version 7)
           (lib (name "FG_REVIEW")(type "KiCad")(uri "$ROOT/FG_REVIEW.kicad_sym")(options "")(descr "Review"))
           (lib (name "FG_TI")(type "KiCad")(uri "$ROOT/FG_TI.kicad_sym")(options "")(descr "eFuse"))
           (lib (name "FG_FAULT")(type "KiCad")(uri "$G88/FG_FAULT.kicad_sym")(options "")(descr "Fault"))
           (lib (name "FG_TIMER")(type "KiCad")(uri "$G89/FG_TIMER.kicad_sym")(options "")(descr "Supervisor"))
           (lib (name "FG_CUTOFF")(type "KiCad")(uri "$G90/FG_CUTOFF.kicad_sym")(options "")(descr "FET"))
           (lib (name "FG_SWITCH")(type "KiCad")(uri "$ROOT/FG_SWITCH.kicad_sym")(options "")(descr "Schmitt"))
          )
          EOF
          kicad-cli version
      - name: Real native KiCad XML/ERC/SVG must prove 618 pins ERC 3 without waivers
        run: |
          set -euo pipefail
          SRC=execution/g1_94_native_erc_cleanup/forest_guardian_g1_94_real_nc_cleanup_review.kicad_sch
          OUT=execution/g1_94_native_erc_cleanup/native_evidence
          mkdir -p "$OUT/svg"
          kicad-cli sch export netlist --format kicadxml -o "$OUT/native.net.xml" "$SRC"
          kicad-cli sch export svg --output "$OUT/svg" "$SRC"
          kicad-cli sch erc --format json --severity-all -o "$OUT/erc.json" "$SRC"
          python3 execution/g1_94_native_erc_cleanup/check_contract.py "$OUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g1-94-native-erc3-and-16-real-nc
          path: |
            execution/g1_94_native_erc_cleanup/native_evidence/
            execution/g1_94_native_erc_cleanup/forest_guardian_g1_94_real_nc_cleanup_review.kicad_sch
            execution/g1_94_native_erc_cleanup/pin_map_618_clean.json
            execution/g1_94_native_erc_cleanup/nc_conversion_audit.json
          if-no-files-found: warn
