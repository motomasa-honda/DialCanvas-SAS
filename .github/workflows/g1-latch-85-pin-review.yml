name: Forest Guardian G1 85-pin unpowered manual latch design review
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g1-latch-85-pin-review.yml'
      - 'execution/g1_interlock_2026-10-16/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g1-disabled-hardware-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Confirm firmware original source hash
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
      - name: Confirm G1 pins U7 physical inhibit and all scope still blocked
        run: |
          set -euo pipefail
          python3 execution/g1_interlock_2026-10-16/check_contract.py
          python3 execution/preflight.py
