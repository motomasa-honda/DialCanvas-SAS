name: G5-06 real P4 signed OTA transaction build and negative signature proof
on:
  pull_request:
    paths:
      - '.github/workflows/g5-06-signed-ota-review.yml'
      - 'execution/g5_06_signed_ota/**'
      - 'execution/g5_05_access_core/**'
      - 'execution/g5_05_https_api/**'
      - 'execution/g5_05_hosted_network/**'
      - 'execution/preflight.py'
      - 'execution/tasks.csv'
      - 'execution/progress.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-06-signed-ota-p4-native-build-rollback-not-released:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Host test transactional OTA safety gates before firmware build
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iexecution/g5_06_signed_ota \
            execution/g5_06_signed_ota/fg_ota_gate.c \
            execution/g5_06_signed_ota/test_ota_gate.c -o /tmp/fg_ota_gate_test
          /tmp/fg_ota_gate_test
          python3 execution/g5_06_signed_ota/check_contract.py
          python3 execution/preflight.py
          python3 tests/check_design.py
      - name: Patch genuine original P4/C6 product firmware source; native IDF target compile
        shell: bash
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
          tar -xzf phase67-source/firmware.tar.gz
          python3 execution/g5_05_access_core/apply_product.py firmware
          python3 execution/g5_05_https_api/apply_https_product.py firmware
          python3 execution/g5_05_hosted_network/apply_network_product.py firmware
          python3 execution/g5_06_signed_ota/apply_product.py firmware
          # The immutable original has obsolete 5MiB OTA slots. DO NOT test OTA
          # under that map: candidate RAW A/B slot geometry is an essential precondition.
          test "$(sha256sum firmware/partition-review-raw-ab.csv | cut -d' ' -f1)" = '38f5771c3d9feb8c09ae13e405f1cf1db7e0c8b05986fc44a3efd339cca452d7'
          cp firmware/partition-review-raw-ab.csv firmware/partition.csv
          grep -q 'fg_ota_boot_guard_unqualified' firmware/main/app_main.c
          grep -q '"fg_ota_port.c"' firmware/main/CMakeLists.txt
          source /opt/esp/idf/export.sh
          idf.py -C firmware set-target esp32p4 >/tmp/fg_ota_settarget.log 2>&1
          idf.py -C firmware build >/tmp/fg_ota_build.log 2>&1 || { tail -150 /tmp/fg_ota_build.log; exit 1; }
          grep -q 'fg_ota_port.c' firmware/build/compile_commands.json
          grep -q 'fg_ota_gate.c' firmware/build/compile_commands.json
          test -s firmware/build/forest_guardian_review.bin
          # Native IDF generated partition table must MATCH candidate byte-for-byte.
          python3 "$IDF_PATH/components/partition_table/gen_esp32part.py" --offset 0x8000 firmware/partition.csv /tmp/g506_raw_ab.bin
          cmp /tmp/g506_raw_ab.bin firmware/build/partition_table/partition-table.bin
          # Binary equality against the official IDF generator proves all
          # labels, offsets, sizes and checksums; no fragile printf formatting.
          python3 - <<'PY'
          from pathlib import Path
          size=Path("firmware/build/forest_guardian_review.bin").stat().st_size
          print(f"APP_BYTES={size} A_B_SLOT=3670016 REMAINING={3670016-size}")
          assert size<0x380000
          config=Path("firmware/sdkconfig").read_text()
          assert 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' not in config
          assert 'CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y' not in config
          print("HOLD release remains unsigned review-only and self-disables OTA writes")
          PY
          sha256sum firmware/build/forest_guardian_review.bin
      - name: Genuine RSA3072 Espressif image sign/verify and tamper rejection (synthetic CI key)
        shell: bash
        run: |
          set -euo pipefail
          source /opt/esp/idf/export.sh
          umask 077
          WORK="$(mktemp -d)"
          export WORK
          trap 'rm -rf "$WORK"' EXIT
          espsecure.py generate_signing_key --version 2 --scheme rsa3072 "$WORK/test-only-key.pem" >/dev/null
          espsecure.py sign_data --version 2 --keyfile "$WORK/test-only-key.pem" \
            --output "$WORK/signed.bin" firmware/build/forest_guardian_review.bin >/dev/null
          espsecure.py verify_signature --version 2 --keyfile "$WORK/test-only-key.pem" "$WORK/signed.bin" >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import os
          d=Path(os.environ['WORK'])
          raw=bytearray((d/'signed.bin').read_bytes())
          assert len(raw)>4096
          raw[256]^=0x20
          (d/'tampered.bin').write_bytes(raw)
          assert len(raw)<=0x380000
          print(f"PASS IDF RSA3072 signature verified on synthetic signed firmware image, length {len(raw)} bytes")
          PY
          if espsecure.py verify_signature --version 2 --keyfile "$WORK/test-only-key.pem" "$WORK/tampered.bin" >/dev/null 2>&1; then
            echo "FAIL tampered firmware signature was accepted"
            exit 1
          fi
          echo "PASS tamper rejected; TEST-ONLY key and signed image deleted on EXIT; no production signer or device"

  g5-06-real-signed-app-and-rollback-build-no-device:
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Build genuine RSA3072-signed ESP32-P4 rollback-enabled product with disposable key
        shell: bash
        run: |
          set -euo pipefail
          source /opt/esp/idf/export.sh
          umask 077
          WORK="$(mktemp -d)"
          export WORK
          trap 'rm -rf "$WORK"' EXIT
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
          tar -xzf phase67-source/firmware.tar.gz
          python3 execution/g5_05_access_core/apply_product.py firmware
          python3 execution/g5_05_https_api/apply_https_product.py firmware
          python3 execution/g5_05_hosted_network/apply_network_product.py firmware
          python3 execution/g5_06_signed_ota/apply_product.py firmware
          # Coherent OTA + dedicated future HTTPS protected NVS partition REVIEW.
          # Never modify the SHA-frozen product archive, only CI's ephemeral copy.
          cp execution/g5_05_secure_partition/partition-nvs-encrypted-raw-ab-review.csv firmware/partition.csv
          python3 execution/g5_05_secure_partition/check_partition.py
          espsecure.py generate_signing_key --version 2 --scheme rsa3072 "$WORK/test-only-sbv2.pem" >/dev/null
          cat >> firmware/sdkconfig.defaults <<EOF
          CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y
          CONFIG_SECURE_SIGNED_APPS_NO_SECURE_BOOT=y
          CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y
          CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y
          CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=y
          CONFIG_SECURE_BOOT_SIGNING_KEY="$WORK/test-only-sbv2.pem"
          EOF
          idf.py -C firmware set-target esp32p4 >/tmp/fg_ota_signed_target.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          cfg=Path("firmware/sdkconfig").read_text()
          needs=[
            "CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y",
            "CONFIG_SECURE_SIGNED_APPS_NO_SECURE_BOOT=y",
            "CONFIG_SECURE_SIGNED_ON_UPDATE_NO_SECURE_BOOT=y",
            "CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=y"
          ]
          for flag in needs:assert flag in cfg,flag
          assert "CONFIG_SECURE_BOOT=y" not in cfg
          assert "CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y" not in cfg
          print("PASS signed-app and rollback config accepted; hardware Secure Boot and eFuse antirollback remain OFF")
          PY
          idf.py -C firmware build >/tmp/fg_ota_signed_build.log 2>&1 || { tail -130 /tmp/fg_ota_signed_build.log; exit 1; }
          test -s firmware/build/forest_guardian_review.bin
          python3 "$IDF_PATH/components/partition_table/gen_esp32part.py" --offset 0x8000 firmware/partition.csv /tmp/g506_signed_ab.bin
          cmp /tmp/g506_signed_ab.bin firmware/build/partition_table/partition-table.bin
          python3 "$IDF_PATH/components/partition_table/gen_esp32part.py" firmware/build/partition_table/partition-table.bin | grep -q 'fg_cfg'
          espsecure.py verify_signature --version 2 --keyfile "$WORK/test-only-sbv2.pem" firmware/build/forest_guardian_review.bin >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import os
          signed=Path("firmware/build/forest_guardian_review.bin").read_bytes()
          assert 0<len(signed)<0x380000
          corrupted=bytearray(signed)
          corrupted[128]^=0x80
          Path(os.environ["WORK"],"mutated.bin").write_bytes(corrupted)
          print(f"PASS signed RSA3072 ESP32-P4 production-source build {len(signed)} B < OTA 3.5MiB slot")
          PY
          if espsecure.py verify_signature --version 2 --keyfile "$WORK/test-only-sbv2.pem" "$WORK/mutated.bin" >/dev/null 2>&1; then
            echo "FAIL signed-mode target artifact allowed tampered data"
            exit 1
          fi
          echo "PASS genuine IDF signed-mode+rollback-build and tamper rejection; disposable key deleted, NO DEVICE FLASH/EFUSE"
