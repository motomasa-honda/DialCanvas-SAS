name: G5 existing firmware integration source audit
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g5-firmware-source-inspection.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g5-firmware-source-inspection.yml'
permissions:
  contents: read
jobs:
  firmware-integration-source-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable existing ESP32-P4 firmware archive
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
          mkdir -p integration-audit
          tar -tzf phase67-source/firmware.tar.gz > integration-audit/source-members.txt
          tar -xzf phase67-source/firmware.tar.gz -C integration-audit
          test -f integration-audit/firmware/main/app_main.c
          test -f integration-audit/firmware/main/CMakeLists.txt
          echo 'SOURCE_AUDIT_ONLY: no firmware build, no patch, no flash' > integration-audit/INTEGRATION_SCOPE.txt
      - name: Export immutable source for implementation review
        uses: actions/upload-artifact@v4
        with:
          name: g5-unmodified-existing-product-source-inspection
          path: integration-audit/
          retention-days: 3
          if-no-files-found: error
