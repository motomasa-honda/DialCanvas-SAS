name: Forest Guardian G5 five disconnected solids and four unsafe joints
on:
  pull_request:
    paths:
      - '.github/workflows/g5-fivepiece-review.yml'
      - 'execution/g5_fivepiece_2026-10-16/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-part-static-hold-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check preserved Phase67 original hash
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
      - name: Verify no false completion when prototype 5-part geometry compiles
        run: |
          set -euo pipefail
          python3 execution/g5_fivepiece_2026-10-16/check_contract.py
          python3 execution/preflight.py
