name: Forest Guardian G5 13-member battery-underpass frame review
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g5-frame-root-review.yml'
      - 'execution/g5_frame_2026-10-16/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-frame-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Immutable firmware source
        run: |
          set -euo pipefail
          echo 'a245ac0da5ad690509a651b2872cc9eb163f0718875a8f238527246f5fdccba3  phase67-source/firmware.tar.gz' | sha256sum -c -
      - name: Verify 13 native model members, 12 overlaps and blocked manufacturing gate
        run: |
          set -euo pipefail
          python3 execution/g5_frame_2026-10-16/check_contract.py
          python3 execution/preflight.py
