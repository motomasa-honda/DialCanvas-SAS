name: G6-06 actual 80-part assembly and 7-axis service order review
on:
  push:
    branches:
      - 'review/forest-guardian-phase66-idf'
    paths:
      - 'execution/ci/full-regression.marker'
      - '.github/workflows/g6-06-assembly-service.yml'
      - 'execution/g6_06_build_service_sequence/**'
      - 'execution/m1_inspection_42.csv'
      - 'execution/cassettes/seven_axis_conditional_layout.json'
      - 'execution/g6_03_80_source_faces/**'
      - 'execution/tasks.csv'
      - 'execution/progress.json'
      - 'execution/preflight.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g6-06-sequence-proof-review-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate G6-06 and all frozen review gates
        run: |
          set -euo pipefail
          python3 execution/g6_06_build_service_sequence/check_contract.py
          python3 execution/preflight.py
          python3 tests/check_design.py
