{
  "schema": "forest-guardian-requirements-v1",
  "format_note": "JSON 構文は YAML 1.2 のサブセット。Python 標準ライブラリのみで検証するため採用。",
  "version": "v0.20 — 2026-10-21 single-motor baseline and migration reconciliation",
  "requirements": [
    {"id":"FG-001","status":"FIXED","text":"製品名は Forest Guardian / DialCanvas Desk Edition とする。","verification":["V-01"]},
    {"id":"FG-002","status":"FIXED","text":"個人製作の高級置き時計とし、品質を優先して予算は柔軟に調整する。","verification":["V-01"]},
    {"id":"FG-003","status":"FIXED","text":"ユーザー承認済み外観 Version 1.0 を維持する。","verification":["V-01"]},
    {"id":"FG-004","status":"FIXED","text":"曲線ウォールナットフレームとキャビネット構造を融合する。","verification":["V-01"]},
    {"id":"FG-005","status":"PROVISIONAL","text":"後続D7引継ぎの基準外形270×205×145mmを参照し、実部品の取付・公差を含む最終寸法は製造前に確定する。","verification":["V-01"]},
    {"id":"FG-006","status":"OPEN","text":"基準高さ205mmに対し、実モジュール・配線・保護板の内部クリアランスと最終高さを確定する。","open_question":"OQ-01","verification":["V-01"]},
    {"id":"FG-007","status":"FIXED","text":"ウォールナット無垢材と突板を部位別に使用する。","verification":["V-01"]},
    {"id":"FG-008","status":"FIXED","text":"前後から整備でき、前面全体を透明保護板で覆う。","verification":["V-01"]},
    {"id":"FG-009","status":"OPEN","text":"一台用の暫定案を透明PC3mm・周縁捕捉・着脱式押さえ縁とし、材料、反り、保持、たわみ、指の到達防止を実物で受け入れる。","open_question":"OQ-02","verification":["V-01"]},
    {"id":"FG-010","status":"FIXED","text":"指定された Forest Guardian 文字盤意匠を継承し中央ケモミミシルエットを最重要とする。","verification":["V-02"]},
    {"id":"FG-011","status":"FIXED","text":"12 時の鳥居、9 時の三日月、3 時の花・髪飾り、6 時の肉球を配置する。","verification":["V-02"]},
    {"id":"FG-012","status":"FIXED","text":"秒針は橙色の尻尾をモチーフとし、背面に THE GUARDIAN OF THE FOREST を刻印する。","verification":["V-02"]},
    {"id":"FG-013","status":"FIXED","text":"中央に円形電子ディスプレイを配置し、時計針をソフトウェアで描画する。","verification":["V-02"]},
    {"id":"FG-014","status":"FIXED","text":"ユーザー作成の文字盤を追加・削除・切り替えできる。既定文字盤は削除できない。","verification":["V-02"]},
    {"id":"FG-015","status":"FIXED","text":"デフォルト文字盤は削除不可とし、選択状態を再起動後も保持する。","verification":["V-02"]},
    {"id":"FG-016","status":"FIXED","text":"microSDのDialCanvas/faces/<名前>/face.jpg (800×800 sRGB Baseline JPEG、最大8MB) と任意のdial.jsonで文字盤の背景・針スタイルを管理し、時刻から3本の針を連続補間して描画する。","verification":["V-02"]},
    {"id":"FG-017","status":"FIXED","text":"画質、黒の美しさ、発色を最優先し、昼夜の視認性を評価する。","verification":["V-03"]},
    {"id":"FG-018","status":"FIXED","text":"円形表示器とし、タッチ操作は不要とする。","verification":["V-03"]},
    {"id":"FG-019","status":"PROVISIONAL","text":"現行候補はWaveshare ESP32-P4-WIFI6-Touch-LCD-3.4Cの3.4型800×800円形IPS完成基板とする。型番・改版の採用、画質と寿命は未受入。","verification":["V-03"]},
    {"id":"FG-020","status":"OPEN","text":"3.4型800×800・MIPI接続のWaveshare完成基板候補について、採用改版・電源・取付・実表示を受け入れる。","open_question":"OQ-04","verification":["V-03"]},
    {"id":"FG-021","status":"FIXED","text":"装飾歯車の個数は7個に限定しない。複数の歯車が実際に噛み合って連動する見た目を優先し、独立軸・独立駆動・独立交換を要求しない。","verification":["V-04"]},
    {"id":"FG-022","status":"FIXED","text":"アンティークブラス仕上げとし、金属と樹脂を適材適所で使う。","verification":["V-04"]},
    {"id":"FG-023","status":"FIXED","text":"歯車を電動でゆっくり回し、時計回りと反時計回りを混在させる。","verification":["V-04"]},
    {"id":"FG-024","status":"PROVISIONAL","text":"歯車の回転周期は1回転10〜60秒を目標とする。現在の計算候補はモーター出力軸1.6rpmで、実負荷時に確認する。","verification":["V-04"]},
    {"id":"FG-025","status":"SUPERSEDED","text":"旧案：7軸独立駆動と各軸の独立交換を必須とする。","superseded_by":"FG-044","verification":[]},
    {"id":"FG-026","status":"OPEN","text":"Adafruit NEMA-8 #4411、TMC2209 #6121、NBK MJT-14-RD-4-5を単一駆動の候補とし、実電流・電圧・始動余力・静音性・取付を確認する。","open_question":"OQ-05","verification":["V-04"]},
    {"id":"FG-027","status":"OPEN","text":"KHK DS1のPOM歯車による不規則二層配置を候補とする。現時点のCADは28個だが歯車数は固定しない。実歯当たり、軸保持、支持、回転周期、始動トルク、音、温度を段階試作で確認する。","open_question":"OQ-06","verification":["V-04"]},
    {"id":"FG-028","status":"FIXED","text":"歯車は通常常時回転とし、ユーザーが ON/OFF を操作できる。","verification":["V-04"]},
    {"id":"FG-029","status":"FIXED","text":"机上の通常使用でモーターや歯車の音が気にならない静音を目指す。音を別の再生音で隠すことは静音達成とみなさない。","verification":["V-04"]},
    {"id":"FG-030","status":"FIXED","text":"暖色 LED で一定の間接照明を行い、光源を直接目立たせない。","verification":["V-05"]},
    {"id":"FG-031","status":"FIXED","text":"暖色の間接LEDは本体の独立した物理スイッチでON/OFFできる。","verification":["V-05"]},
    {"id":"FG-032","status":"FIXED","text":"本体物理ボタンを設ける。","verification":["V-06"]},
    {"id":"FG-033","status":"FIXED","text":"初号機の文字盤管理は電源OFFでmicroSDをPC編集し、本体ロータリーエンコーダーで選択する。Web管理は実装せず、Wi-Fiは時刻同期に使う。","verification":["V-06"]},
    {"id":"FG-034","status":"FIXED","text":"時計と歯車の制御を分離する。","verification":["V-06"]},
    {"id":"FG-035","status":"OPEN","text":"SNTP同期と外付けDS3231 RTCによる電源断後の時刻復旧を実機確認する。","open_question":"OQ-08","verification":["V-06"]},
    {"id":"FG-036","status":"FIXED","text":"本体の押し込み付きロータリーエンコーダーは、回転で文字盤一覧移動、短押しで選択、長押しで装飾歯車の回転を開始/停止する。独立物理スイッチはモーター電源を遮断する。","verification":["V-06"]},
    {"id":"FG-037","status":"FIXED","text":"既存 Git 履歴、旧資料、Issues、Releases、default branch とリポジトリ名を保持する。","verification":["V-07"]},
    {"id":"FG-038","status":"OPEN","text":"ユーザー提示の外観参照ボードを特定済み。個別文字盤の高解像度原画と利用条件を確認する。","open_question":"OQ-10","verification":["V-07"]},
    {"id":"FG-039","status":"FIXED","text":"旧7軸設計の48項目台帳と証拠は履歴として保持し、新設計は新しい作業一覧で管理する。未検証のコード・CAD・回路を完成扱いにしない。","verification":["V-07"]},
    {"id":"FG-040","status":"REJECTED","text":"ユーザー向け歯車速度調整を設ける案。現要求では不要。","verification":[]},
    {"id":"FG-041","status":"SUPERSEDED","text":"旧案：歯車同士の噛み合いを必須とする仕様。現行はFG-021で複数の噛合い歯車を優先するが、個数・独立駆動は要求しない。","superseded_by":"FG-021","verification":[]},
    {"id":"FG-042","status":"SUPERSEDED","text":"旧案：時計針の動作方式を文字盤ごとに設定可能にする。現行はFG-045により全文字盤で連続掃引に統一する。","superseded_by":"FG-045","verification":[]},
    {"id":"FG-043","status":"FIXED","text":"LED は一定照明とし、点滅や派手な演出を行わない。","verification":["V-05"]},
    {"id":"FG-044","status":"PROVISIONAL","text":"モーター1個で複数の噛合い歯車を連動させる構成を第一候補とする。実機の静音性・トルク・外観で不適合が出た場合のみ別方式を再検討する。","verification":["V-04"]},
    {"id":"FG-045","status":"FIXED","text":"画面上の時計針は段階的に跳ねず、連続して滑らかに掃引する。装飾歯車の回転や停止から時計表示を独立させる。","verification":["V-02"]},
    {"id":"FG-046","status":"FIXED","text":"文字盤画像はmicroSDのDialCanvas/faces/<名前>/face.jpgから追加・削除・切替し、本体ロータリーエンコーダーで選ぶ。800×800 sRGB Baseline JPEG (最大8MB) と任意のversion 1 dial.jsonを使い、ファームウェアはSDを読取専用で扱う。実機受入は未完。","verification":["V-02","V-06"]},
    {"id":"FG-047","status":"REJECTED","text":"初号機に音声通知用スピーカーを追加する案。要求がなく、静音目標の評価にも寄与しないため対象外。","verification":[]},
    {"id":"FG-048","status":"OPEN","text":"USB Type-C PDから9Vを受ける候補とし、9Vモーター枝と既製DC/DCによる5V表示・照明枝へ安全に分配する。全負荷電流・契約・保護・配線を実測して確定する。","open_question":"OQ-12","verification":["V-06"]},
    {"id":"FG-049","status":"FIXED","text":"要求を満たす既製品がある部位は、安価で入手しやすい既製品を優先する。専用製作は木製外装、既製品の取付・接続に必要な簡単な部材、外観固有部品に絞る。","verification":["V-08"]},
    {"id":"FG-050","status":"FIXED","text":"歯車は等間隔のリング状に整列させず、歯数と配置を不規則にする。見た目の重なりは別のZ面で作り、歯面同士は物理干渉させない。","verification":["V-04"]}
  ],
