<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">BSS20 gear support test coupons quote drawing v0.1</title>
<desc id="desc">Quote-only drawing for a polycarbonate bushing press-fit coupon, four-gear pilot support plate, and walnut groove test block.</desc>
<defs>
  <marker id="dim" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L9,4.5 L0,9 z" fill="#334155"/></marker>
  <style>
    text{font-family:'IPAGothic','Noto Sans CJK JP',sans-serif;fill:#172033}
    .title{font-size:34px;font-weight:700}.sub{font-size:20px;fill:#475569}.paneltitle{font-size:25px;font-weight:700}
    .label{font-size:20px}.small{font-size:17px;fill:#475569}.tiny{font-size:15px;fill:#475569}
    .panel{fill:#fff;stroke:#9aa8b2;stroke-width:2}.pc{fill:#e8f2f1;stroke:#397c78;stroke-width:3}
    .gear{fill:#d8ae59;fill-opacity:.32;stroke:#986a20;stroke-width:2}.hole{fill:#fff;stroke:#243746;stroke-width:3}
    .wood{fill:#c99d72;stroke:#6e4b2d;stroke-width:3}.slot{fill:#f7fafc;stroke:#6e4b2d;stroke-width:2}
    .plate{fill:#78b8c2;stroke:#226274;stroke-width:2}.dimline{stroke:#334155;stroke-width:1.6;marker-start:url(#dim);marker-end:url(#dim)}
    .ext{stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 4}.guide{stroke:#687581;stroke-width:1.5;stroke-dasharray:6 5}
  </style>
</defs>
<rect width="1600" height="1150" fill="#f7f8f8"/>
<text class="title" x="50" y="57">歯車支持部・評価試験片　加工見積用 v0.1</text>
<text class="sub" x="50" y="91">見積・試験片用の候補寸法。完成品の製作図、購入指示、加工開始指示ではありません。</text>

<!-- PC press-fit coupon -->
<rect class="panel" x="35" y="125" width="340" height="865" rx="12"/>
<text class="paneltitle" x="58" y="168">A　ブッシュ圧入片</text>
<text class="small" x="58" y="198">同じ透明PC材・公称厚8mm</text>
<text class="small" x="58" y="225">正面図（20 × 20mm）</text>
<rect class="pc" x="130" y="260" width="120" height="120"/>
<circle class="hole" cx="190" cy="320" r="24"/>
<line class="ext" x1="130" y1="390" x2="130" y2="418"/><line class="ext" x1="250" y1="390" x2="250" y2="418"/>
<line class="dimline" x1="130" y1="410" x2="250" y2="410"/>
<text class="small" x="190" y="440" text-anchor="middle">20mm</text>
<line class="ext" x1="258" y1="260" x2="285" y2="260"/><line class="ext" x1="258" y1="380" x2="285" y2="380"/>
<line class="dimline" x1="277" y1="260" x2="277" y2="380"/>
<text class="small" x="302" y="320" transform="rotate(90 302 320)" text-anchor="middle">20mm</text>
<line class="guide" x1="190" y1="320" x2="259" y2="320"/>
<text class="label" x="60" y="475">穴：Ø8 H7 貫通 ×1</text>
<text class="small" x="60" y="505">公称範囲 8.000〜8.015mm</text>
<text class="small" x="60" y="548">側面図</text>
<rect class="pc" x="130" y="570" width="120" height="48"/>
<line class="ext" x1="130" y1="628" x2="130" y2="657"/><line class="ext" x1="250" y1="628" x2="250" y2="657"/>
<line class="dimline" x1="130" y1="650" x2="250" y2="650"/>
<text class="small" x="190" y="680" text-anchor="middle">20mm</text>
<text class="label" x="60" y="729">厚さ：8mm</text>
<text class="small" x="60" y="778">目的：80B-0608を圧入し、</text>
<text class="small" x="60" y="806">割れ・白化・移動・回転抵抗</text>
<text class="small" x="60" y="834">を確認する。</text>
<text class="small" x="60" y="888">PC材はAS ONE 68-7869-18</text>
<text class="small" x="60" y="916">の同じ板から切り出す案。</text>
<text class="tiny" x="60" y="959">材の代替はせず、厚さ/反りを受入時に記録。</text>

<!-- Four gear pilot plate -->
<rect class="panel" x="395" y="125" width="760" height="865" rx="12"/>
<text class="paneltitle" x="420" y="168">B　4歯車 手回し試験板</text>
<text class="small" x="420" y="198">透明PC 100 × 56 × 8mm　／　正面図、左上を座標原点</text>
<rect class="pc" x="445" y="235" width="600" height="336"/>
<circle class="gear" cx="925" cy="341.95" r="66"/><circle class="hole" cx="925" cy="341.95" r="24"/>
<circle class="gear" cx="807.094" cy="364.276" r="66"/><circle class="hole" cx="807.094" cy="364.276" r="24"/>
<circle class="gear" cx="691.282" cy="395.692" r="66"/><circle class="hole" cx="691.282" cy="395.692" r="24"/>
<circle class="gear" cx="588.256" cy="467.222" r="66"/><circle class="hole" cx="588.256" cy="467.222" r="24"/>
<text class="tiny" x="925" y="347" text-anchor="middle">A00</text>
<text class="tiny" x="807" y="370" text-anchor="middle">A01</text>
<text class="tiny" x="691" y="401" text-anchor="middle">A02</text>
<text class="tiny" x="588" y="473" text-anchor="middle">A03</text>
<line class="ext" x1="445" y1="582" x2="445" y2="612"/><line class="ext" x1="1045" y1="582" x2="1045" y2="612"/>
<line class="dimline" x1="445" y1="604" x2="1045" y2="604"/><text class="small" x="745" y="633" text-anchor="middle">100mm</text>
<line class="ext" x1="1054" y1="235" x2="1080" y2="235"/><line class="ext" x1="1054" y1="571" x2="1080" y2="571"/>
<line class="dimline" x1="1072" y1="235" x2="1072" y2="571"/><text class="small" x="1100" y="403" transform="rotate(90 1100 403)" text-anchor="middle">56mm</text>
<text class="label" x="420" y="680">穴：Ø8 H7 貫通 ×4　／　軸受 OILES 80B-0608</text>
<text class="small" x="420" y="716">隣接軸中心距離：20.000〜20.033mm（H8プラス側の候補）。</text>
<text class="small" x="420" y="748">一般外形は加工先標準。小数座標は加工公差の指示ではない。</text>
<line x1="420" y1="775" x2="1125" y2="775" stroke="#c2cbd1" stroke-width="1.5"/>
<text class="label" x="420" y="813">穴中心座標（左上原点、mm）</text>
<text class="small" x="435" y="852">A00　(80.000, 17.825)</text><text class="small" x="435" y="885">A01　(60.349, 21.546)</text>
<text class="small" x="760" y="852">A02　(41.047, 26.782)</text><text class="small" x="760" y="885">A03　(23.876, 37.037)</text>
<text class="tiny" x="420" y="947">目的：正逆10回転で噛み込み・歯飛び・板/ワッシャー擦れ・ブッシュ移動を確認。</text>

<!-- Walnut groove coupon -->
<rect class="panel" x="1175" y="125" width="390" height="865" rx="12"/>
<text class="paneltitle" x="1200" y="168">C　木溝確認片</text>
<text class="small" x="1200" y="198">ウォールナット候補材</text>
<text class="small" x="1200" y="225">素材ブロック：30 × 20 × 12mm</text>
<rect class="wood" x="1220" y="260" width="240" height="160"/>
<path d="M1390 260 L1460 260 L1460 310 L1390 310 Z" class="slot"/>
<text class="tiny" x="1340" y="365" text-anchor="middle">溝は長さ30mm方向へ通す</text>
<text class="small" x="1200" y="462">溝断面（模式図）</text>
<rect class="wood" x="1215" y="495" width="240" height="200"/>
<!-- groove cut into the inner face; test strip and optional shims -->
<rect class="slot" x="1375" y="550" width="80" height="90"/>
<rect class="plate" x="1375" y="555" width="80" height="80"/>
<line class="ext" x1="1375" y1="645" x2="1375" y2="670"/><line class="ext" x1="1455" y1="645" x2="1455" y2="670"/>
<line class="dimline" x1="1375" y1="662" x2="1455" y2="662"/><text class="small" x="1415" y="689" text-anchor="middle">4mm深さ</text>
<line class="ext" x1="1462" y1="550" x2="1490" y2="550"/><line class="ext" x1="1462" y1="640" x2="1490" y2="640"/>
<line class="dimline" x1="1482" y1="550" x2="1482" y2="640"/><text class="small" x="1510" y="595" transform="rotate(90 1510 595)" text-anchor="middle">溝幅9mm</text>
<text class="small" x="1200" y="740">溝：9mm幅 × 4mm深さ</text>
<text class="small" x="1200" y="773">8mm PC支持板端を挿入し、</text>
<text class="small" x="1200" y="802">PET 0.25/0.5mmシムで保持を確認。</text>
<text class="tiny" x="1200" y="862">実ケース候補と同じ材/仕上げで試験。</text>
<text class="tiny" x="1200" y="891">材が未決ならケース全量加工は保留。</text>

<rect x="35" y="1015" width="1530" height="100" rx="10" fill="#fff7e8" stroke="#c99742" stroke-width="2"/>
<text class="label" x="58" y="1055">見積条件：</text>
<text class="small" x="180" y="1055">A/BはAS ONE 68-7869-18の同一8mm PC板から切り出す案。別材へ置換せず、加工費・納期・測定可能な寸法を回答。</text>
<text class="small" x="58" y="1090">Cは実ケース候補のウォールナット材から作る試験片。図面の材料や寸法は評価候補で、加工・購入の承認を意味しない。</text>
</svg>
