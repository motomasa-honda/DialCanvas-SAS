<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">Waveshare 3.4C four-arm display carrier candidate</title>
  <desc id="desc">Top view and front-to-back stack of a provisional 3 millimeter polycarbonate carrier, with four arms from the official M4 board pattern to M3 anchors on support plate A.</desc>
  <style>
    text{font-family:DejaVu Sans,sans-serif;fill:#29251f}.title{font-size:28px;font-weight:700}.head{font-size:19px;font-weight:700}.label{font-size:15px}.small{font-size:13px;fill:#554e45}.tiny{font-size:11px;fill:#625c54}.opening{fill:#e7f2f0;stroke:#39787c;stroke-width:3;stroke-dasharray:10 7}.board{fill:#315b60;fill-opacity:.22;stroke:#315b60;stroke-width:3}.arm{fill:none;stroke:#c58d3b;stroke-opacity:.68;stroke-width:50.4;stroke-linecap:round}.boardhole{fill:#fff7e7;stroke:#172329;stroke-width:2}.anchor{fill:#bd6337;stroke:#502414;stroke-width:2}.dim{stroke:#342e28;stroke-width:1.5;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.panel{fill:#f6f0e5;stroke:#b5a68f;stroke-width:1.5}.rule{stroke:#c8bead;stroke-width:1}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M9,0 L0,4.5 L9,9" fill="none" stroke="#342e28" stroke-width="1.1"/></marker></defs>
  <rect width="1180" height="760" fill="#fbfaf6"/>
  <text class="title" x="36" y="44">3.4C display carrier · fit candidate v0.1</text>
  <text class="small" x="36" y="70">Waveshare SKU 31523 catalog pattern + BSS20 support plate A · schematic only, not a cut file</text>

  <text class="head" x="280" y="111" text-anchor="middle">Top view (mm)</text>
  <g transform="translate(42,60) scale(0.85)">
  <circle class="opening" cx="280" cy="269" r="166.6"/>
  <circle class="board" cx="280" cy="269" r="161"/>
  <g class="arm">
    <line x1="385" y1="159.1" x2="504" y2="45"/>
    <line x1="175" y1="159.1" x2="56" y2="45"/>
    <line x1="385" y1="378.9" x2="504" y2="493"/>
    <line x1="175" y1="378.9" x2="56" y2="493"/>
  </g>
  <g class="boardhole">
    <circle cx="385" cy="159.1" r="6.3"/><circle cx="175" cy="159.1" r="6.3"/>
    <circle cx="385" cy="378.9" r="6.3"/><circle cx="175" cy="378.9" r="6.3"/>
  </g>
  <g class="anchor">
    <circle cx="504" cy="45" r="4.8"/><circle cx="56" cy="45" r="4.8"/>
    <circle cx="504" cy="493" r="4.8"/><circle cx="56" cy="493" r="4.8"/>
  </g>
  <line class="dim" x1="112" y1="465" x2="448" y2="465"/>
  <text class="tiny" x="280" y="484" text-anchor="middle">Ø119mm support-A opening</text>
  <line class="dim" x1="14" y1="540" x2="546" y2="540"/>
  <text class="tiny" x="280" y="557" text-anchor="middle">190mm stock blank (outline max ±89mm, 6mm margin)</text>
  </g>

  <rect class="panel" x="585" y="99" width="555" height="430" rx="10"/>
  <text class="head" x="615" y="139">Candidate parts and locations</text>
  <text class="label" x="615" y="179">1 × 3mm clear PC spider · KPAC303-1 stock candidate</text>
  <text class="small" x="615" y="204">Four diagonal arms, 18mm wide; 190 × 190mm maximum blank.</text>
  <line class="rule" x1="615" y1="223" x2="1110" y2="223"/>
  <text class="label" x="615" y="258">Board side · 4 × M4 clearance Ø4.5mm</text>
  <text class="small" x="615" y="282">Centers X=±37.50, Y=±39.25mm; 2mm POM sleeves.</text>
  <text class="small" x="615" y="305">M4 × 8mm screws: 3mm PC + 2mm sleeve leaves 3mm</text>
  <text class="small" x="615" y="326">nominal thread engagement in the drawing's 4mm depth.</text>
  <line class="rule" x1="615" y1="345" x2="1110" y2="345"/>
  <text class="label" x="615" y="380">Plate side · 4 × M3 clearance Ø3.4mm</text>
  <text class="small" x="615" y="404">Centers X/Y=±80mm; total 7mm spacer stack.</text>
  <text class="small" x="615" y="427">M3 × 25mm bolts pass through carrier, spacers,</text>
  <text class="small" x="615" y="448">and 8mm support plate A into washer + locknut.</text>
  <text class="tiny" x="615" y="490">Orange: carrier arms · cream: board holes · red: M3 anchors</text>

  <text class="head" x="42" y="565">Front-to-back stack · z (mm), not to scale</text>
  <line x1="82" y1="662" x2="534" y2="662" stroke="#554e45" stroke-width="2"/>
  <rect x="95" y="621" width="47" height="26" fill="#315b60" fill-opacity=".22" stroke="#315b60" stroke-width="2"/>
  <text class="tiny" x="118.5" y="638" text-anchor="middle">Display</text>
  <rect x="148" y="612" width="9" height="45" fill="#c58d3b" fill-opacity=".72" stroke="#815414" stroke-width="1.5"/>
  <rect x="178" y="621" width="24" height="26" fill="#dbe9e5" stroke="#477a78" stroke-width="2"/>
  <text class="tiny" x="190" y="638" text-anchor="middle">A plate</text>
  <rect x="229" y="621" width="18" height="26" fill="#d19a40" stroke="#815414" stroke-width="1.5"/>
  <text class="tiny" x="238" y="638" text-anchor="middle">A</text>
  <rect x="256" y="621" width="18" height="26" fill="#9a572b" stroke="#6b391c" stroke-width="1.5"/>
  <text class="tiny" x="265" y="638" text-anchor="middle">B</text>
  <rect x="301" y="621" width="24" height="26" fill="#dbe9e5" stroke="#477a78" stroke-width="2"/>
  <text class="tiny" x="313" y="638" text-anchor="middle">B plate</text>
  <rect x="328" y="612" width="66" height="45" fill="#bdc3c1" stroke="#69706c" stroke-width="1.5"/>
  <text class="tiny" x="361" y="638" text-anchor="middle">Coupler</text>
  <rect x="400" y="603" width="99" height="54" fill="#657681" stroke="#35424b" stroke-width="1.5"/>
  <text class="tiny" x="449.5" y="634" text-anchor="middle" fill="#fff">NEMA-8</text>
  <line x1="520" y1="598" x2="520" y2="666" stroke="#49392b" stroke-width="4"/>
  <text class="tiny" x="95" y="608">z=1.5…17</text>
  <text class="tiny" x="136" y="600">Carrier 19…22</text>
  <text class="tiny" x="178" y="608">29…37</text>
  <text class="tiny" x="225" y="608">46…52</text>
  <text class="tiny" x="253" y="608">55…61</text>
  <text class="tiny" x="299" y="608">70…78</text>
  <text class="tiny" x="326" y="600">84…106</text>
  <text class="tiny" x="398" y="591">108…141</text>
  <text class="tiny" x="520" y="684" text-anchor="middle">Rear wall z=148</text>
  <text class="tiny" x="280" y="702" text-anchor="middle">Display → carrier → A/B gears → coupler/motor; outer depth 172mm provisional.</text>
  <rect class="panel" x="650" y="564" width="490" height="138" rx="10"/>
  <text class="small" x="680" y="599">Catalog outline, hole pattern and depth set the layout.</text>
  <text class="small" x="680" y="624">At assembly, check screw engagement, USB/SD access,</text>
  <text class="small" x="680" y="648">cable routing, carrier support and free gear movement.</text>
  <text class="tiny" x="680" y="678">No revision check or test coupon before purchase.</text>
</svg>
