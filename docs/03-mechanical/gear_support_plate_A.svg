<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="-18 -28 288 232" role="img" aria-labelledby="title desc">
  <title id="title">Support plate A nominal hole pattern</title>
  <desc id="desc">Nominal 252 by 187 by 8 millimeter clear polycarbonate plate, Ø112 circular opening and nominal seven millimeter bushing seats for 14 gear axes in plane A. Not a manufacturing file.</desc>
