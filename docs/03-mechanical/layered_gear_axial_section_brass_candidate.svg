<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780" role="img" aria-labelledby="title desc">
  <title id="title">21 brass gear candidate axial section</title>
  <desc id="desc">Nominal axial arrangement for an optional mixed KHK BSS brass and DS POM gear set. Not a fabrication drawing. Display board depth is not to scale.</desc>
  <style>
    text { font-family: "DejaVu Sans", sans-serif; fill:#29241e; }
    .title { font-size:29px; font-weight:700; } .subtitle { font-size:16px; fill:#61594e; }
    .part { font-size:14px; font-weight:600; } .small { font-size:13px; fill:#61594e; }
    .tiny { font-size:12px; fill:#61594e; } .head { font-size:18px; font-weight:700; }
    .plate { fill:#c9e5e5; stroke:#39787c; stroke-width:2; }
    .bearing { fill:#e9d19d; stroke:#76552d; stroke-width:1.5; }
    .shaft { fill:#818f98; stroke:#38464d; stroke-width:1.5; }
    .brass { fill:#d9a445; stroke:#80531d; stroke-width:2; }
    .brass-face { fill:#be8430; stroke:#80531d; stroke-width:2; }
    .coupler { fill:#c5c8bd; stroke:#53574e; stroke-width:2; }
    .motor { fill:#647887; stroke:#293943; stroke-width:2; }
    .datum { stroke:#b14c35; stroke-width:2; stroke-dasharray:7 5; }
    .wall { stroke:#33271d; stroke-width:8; } .axis { stroke:#92928c; stroke-width:1.5; stroke-dasharray:7 5; }
    .tick { stroke:#514b43; stroke-width:1.4; }
    .panel { fill:#f4eee3; stroke:#b8a88e; stroke-width:1.5; }
    .dim { stroke:#514b43; stroke-width:1.5; marker-start:url(#arrow); marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto-start-reverse"><path d="M9,0 L0,4.5 L9,9" fill="none" stroke="#514b43" stroke-width="1.2"/></marker></defs>
  <rect width="1800" height="780" fill="#fbfaf6"/>
  <text class="title" x="42" y="48">BRASS HYBRID · NOMINAL AXIAL STACK</text>
  <text class="subtitle" x="42" y="78">21 brass gears / 7 POM gears · z=0 is the inside face of the front frame · dimensions in mm · not a fabrication drawing</text>
  <text class="small" x="42" y="130">FRONT</text>
  <text class="small" x="1018" y="130">REAR INNER WALL</text>
  <line class="axis" x1="65" y1="267" x2="1100" y2="267"/>
  <rect class="plate" x="110.0" y="212.0" width="64.0" height="110.0" rx="5"/><text class="part" x="142.0" y="272.0" text-anchor="middle">Front</text>
<rect class="bearing" x="110.0" y="260.0" width="64.0" height="14.0" rx="5"/>
<rect class="shaft" x="110.0" y="261.0" width="472.0" height="12.0" rx="5"/>
<rect class="brass" x="182.0" y="248.0" width="64.0" height="38.0" rx="5"/><text class="part" x="214.0" y="272.0" text-anchor="middle">Hub A</text>
<rect class="brass-face" x="246.0" y="231.0" width="48.0" height="72.0" rx="5"/><text class="part" x="270.0" y="272.0" text-anchor="middle">A face</text>
<rect class="brass-face" x="310.0" y="231.0" width="48.0" height="72.0" rx="5"/><text class="part" x="334.0" y="272.0" text-anchor="middle">B face</text>
<rect class="brass" x="358.0" y="248.0" width="64.0" height="38.0" rx="5"/><text class="part" x="390.0" y="272.0" text-anchor="middle">Hub B</text>
<rect class="plate" x="430.0" y="212.0" width="64.0" height="110.0" rx="5"/><text class="part" x="462.0" y="272.0" text-anchor="middle">Rear</text>
<rect class="bearing" x="430.0" y="260.0" width="64.0" height="14.0" rx="5"/>
<rect class="coupler" x="502.0" y="228.0" width="240.0" height="78.0" rx="5"/><text class="part" x="622.0" y="272.0" text-anchor="middle">4 to 6mm</text>
<rect class="motor" x="742.0" y="200.0" width="264.0" height="134.0" rx="5"/><text class="part" x="874.0" y="272.0" text-anchor="middle">NEMA-8</text>
  <line class="datum" x1="430.0" y1="165" x2="430.0" y2="435"/>
  <text class="tiny" x="435.0" y="156">LCD glass datum z=40</text>
  <line class="wall" x1="1078.0" y1="178" x2="1078.0" y2="354"/>
  <line class="dim" x1="1006.0" y1="383" x2="1078.0" y2="383"/>
  <text class="small" x="1042.0" y="408" text-anchor="middle">9mm rear gap</text>
  <line class="dim" x1="294.0" y1="453" x2="310.0" y2="453"/>
  <text class="tiny" x="302.0" y="446" text-anchor="middle">2mm gap</text>
  <line class="axis" x1="110.0" y1="490" x2="1078.0" y2="490"/>
  <line class="tick" x1="110.0" y1="477" x2="110.0" y2="490"/><text class="small" x="110.0" y="511" text-anchor="middle">0</text><line class="tick" x1="190.0" y1="477" x2="190.0" y2="490"/><text class="small" x="190.0" y="511" text-anchor="middle">10</text><line class="tick" x1="270.0" y1="477" x2="270.0" y2="490"/><text class="small" x="270.0" y="511" text-anchor="middle">20</text><line class="tick" x1="350.0" y1="477" x2="350.0" y2="490"/><text class="small" x="350.0" y="511" text-anchor="middle">30</text><line class="tick" x1="430.0" y1="477" x2="430.0" y2="490"/><text class="small" x="430.0" y="511" text-anchor="middle">40</text><line class="tick" x1="510.0" y1="477" x2="510.0" y2="490"/><text class="small" x="510.0" y="511" text-anchor="middle">50</text><line class="tick" x1="590.0" y1="477" x2="590.0" y2="490"/><text class="small" x="590.0" y="511" text-anchor="middle">60</text><line class="tick" x1="670.0" y1="477" x2="670.0" y2="490"/><text class="small" x="670.0" y="511" text-anchor="middle">70</text><line class="tick" x1="750.0" y1="477" x2="750.0" y2="490"/><text class="small" x="750.0" y="511" text-anchor="middle">80</text><line class="tick" x1="830.0" y1="477" x2="830.0" y2="490"/><text class="small" x="830.0" y="511" text-anchor="middle">90</text><line class="tick" x1="910.0" y1="477" x2="910.0" y2="490"/><text class="small" x="910.0" y="511" text-anchor="middle">100</text><line class="tick" x1="990.0" y1="477" x2="990.0" y2="490"/><text class="small" x="990.0" y="511" text-anchor="middle">110</text><line class="tick" x1="1070.0" y1="477" x2="1070.0" y2="490"/><text class="small" x="1070.0" y="511" text-anchor="middle">120</text>
  <text class="small" x="594.0" y="539" text-anchor="middle">z (mm)</text>
  <rect class="panel" x="1180" y="116" width="570" height="574" rx="8"/>
  <text class="head" x="1210" y="157">Z CHANGES</text>
  <text class="small" x="1210" y="198">A face: z=17–23 (+2mm)</text>
  <text class="small" x="1210" y="226">B face: z=25–31 (+2mm)</text>
  <text class="small" x="1210" y="254">Rear plate: z=40–48 (+4mm)</text>
  <text class="small" x="1210" y="282">Coupler: 49–79 / motor: 79–112</text>
  <text class="small" x="1210" y="310">Rear gap: 9mm in a 145mm-deep case</text>
  <text class="head" x="1210" y="364">OPEN FIT CHECKS</text>
  <text class="small" x="1210" y="402">- 3.4C carrier and rear ports in 120mm opening</text>
  <text class="small" x="1210" y="432">- 6mm shaft retention and 10mm coupler insertion</text>
  <text class="small" x="1210" y="462">- NEMA-8 rear wire bend clearance</text>
  <text class="small" x="1210" y="492">- Mixed 7/8mm bearing holes in the support plates</text>
  <text class="head" x="1210" y="552">DISPLAY DATUM</text>
  <text class="small" x="1210" y="585">LCD glass stays at z=40. Board thickness and</text>
  <text class="small" x="1210" y="613">connectors are not to scale; verify with carrier.</text>
  <text class="tiny" x="42" y="733">Brass hub length 8mm. Nominal 1mm clearance to each support plate. Gear teeth, tolerances, plate flex and wire routing are not validated; this is not a fabrication drawing.</text>
</svg>