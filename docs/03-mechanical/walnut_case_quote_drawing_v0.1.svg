<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>ウォールナットケース 見積検討図 v0.1 — 外形・断面</title>
  <desc>270×205×145mmは実部品・端子/ケーブル・整備空間の統合前の暫定参照包絡。概算見積用で、外箱寸法は未凍結、製作リリースではない。</desc>
  <defs>
    <pattern id="wood" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#eadcc5"/><path d="M0 1.3 Q2 0.3 5 1.5 M0 4.1 Q2 3.2 5 4.2" fill="none" stroke="#98734d" stroke-width=".25" opacity=".55"/></pattern>
    <pattern id="ply" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#d9c8ac"/><path d="M0 1H4 M0 3H4" stroke="#9a815f" stroke-width=".25"/></pattern>
    <pattern id="pc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#d5eef0" fill-opacity=".55"/><path d="M0 4L4 0" stroke="#69a6ad" stroke-width=".3" opacity=".65"/></pattern>
    <marker id="arr" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto-start-reverse"><path d="M0 0L5 2.5L0 5Z" fill="#273640"/></marker>
    <style>
      text{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;fill:#18252d}
      .title{font-size:6px;font-weight:700}.subtitle{font-size:3.5px}.head{font-size:4px;font-weight:700}.label{font-size:3.2px}.small{font-size:2.8px}.tiny{font-size:2.35px}
      .outline{fill:none;stroke:#18252d;stroke-width:.55}.fine{fill:none;stroke:#455861;stroke-width:.3}.dash{fill:none;stroke:#388196;stroke-width:.45;stroke-dasharray:2 1.3}.dim{fill:none;stroke:#273640;stroke-width:.3;marker-start:url(#arr);marker-end:url(#arr)}
      .ext{fill:none;stroke:#60717a;stroke-width:.25}.wood{fill:url(#wood);stroke:#18252d;stroke-width:.45}.ply{fill:url(#ply);stroke:#18252d;stroke-width:.45}.glass{fill:url(#pc);stroke:#388196;stroke-width:.5}.panel{fill:#fbfaf7;stroke:#92a0a5;stroke-width:.35}.note{fill:#f5f2eb;stroke:#a8a197;stroke-width:.35}
    </style>
  </defs>
  <rect width="420" height="297" fill="#fff"/>
  <rect x="8" y="8" width="404" height="281" fill="none" stroke="#33434b" stroke-width=".4"/>
  <text x="16" y="19" class="title">Walnut Case — Quote Drawing v0.1</text>
  <text x="16" y="26" class="subtitle">Forest Guardian / DialCanvas Desk Edition | REFERENCE ENVELOPE, SUBJECT TO CHANGE | ESTIMATE ONLY — NOT FOR FABRICATION</text>
  <rect x="327" y="12" width="76" height="16" class="note"/>
  <text x="365" y="18" text-anchor="middle" class="label" font-weight="700">QUOTATION ONLY</text>
  <text x="365" y="24" text-anchor="middle" class="tiny">Joinery and retainers: maker proposal</text>

  <!-- Front elevation -->
  <text x="19" y="39" class="head">A  FRONT ELEVATION (outside)</text>
  <g transform="translate(25 50) scale(.60)">
    <path d="M0 0H270V205H0Z M12 12H258V193H12Z" class="wood" fill-rule="evenodd"/>
    <rect x="12" y="12" width="246" height="181" class="glass"/>
    <rect x="9" y="9" width="252" height="187" class="dash"/>
    <circle cx="135" cy="102.5" r="57.5" class="fine" stroke-dasharray="2 1.3"/>
    <line x1="135" y1="0" x2="135" y2="205" class="fine" stroke-dasharray="1 1.5"/>
    <line x1="0" y1="102.5" x2="270" y2="102.5" class="fine" stroke-dasharray="1 1.5"/>
    <text x="135" y="96" text-anchor="middle" class="label">3.4C display Ø115</text>
    <text x="135" y="108" text-anchor="middle" class="small">Candidate: display centered in case</text>
    <text x="135" y="202" text-anchor="middle" class="small">Dashed: support plate 252×187 / opening 246×181</text>
  </g>
  <line x1="25" y1="45" x2="187" y2="45" class="dim"/><text x="106" y="43" text-anchor="middle" class="label">Ref. overall 270</text>
  <line x1="19" y1="50" x2="19" y2="173" class="dim"/><text x="15" y="112" transform="rotate(-90 15 112)" text-anchor="middle" class="label">Ref. overall 205</text>
  <text x="25" y="181" class="small">P1: solid walnut, 9 thick; outer 270×205; opening 246×181.</text>
  <text x="25" y="186" class="small">Basic straight frame only. Curve/edge treatment is optional quote work; old concept image is not a cut template.</text>

  <!-- Side section -->
  <text x="222" y="39" class="head">B  SIDE VIEW (internal parts schematic)</text>
  <g transform="translate(229 50) scale(.60)">
    <rect x="0" y="0" width="145" height="205" fill="#f8f7f3" stroke="#18252d" stroke-width=".8"/>
    <rect x="0" y="0" width="9" height="205" class="wood"/>
    <rect x="9" y="0" width="3" height="205" class="glass"/>
    <rect x="12" y="0" width="121" height="205" class="ply"/>
    <rect x="133" y="0" width="12" height="205" class="ply"/>
    <rect x="19" y="9" width="8" height="187" class="dash"/>
    <rect x="60" y="9" width="8" height="187" class="dash"/>
    <line x1="9" y1="0" x2="9" y2="205" class="fine"/>
    <line x1="12" y1="0" x2="12" y2="205" class="fine"/>
    <line x1="133" y1="0" x2="133" y2="205" class="fine"/>
    <text x="4.5" y="102" class="tiny" text-anchor="middle" transform="rotate(-90 4.5 102)">Frame 9</text>
    <text x="10.5" y="102" class="tiny" text-anchor="middle" transform="rotate(-90 10.5 102)">PC 3</text>
    <text x="25" y="104" class="small" text-anchor="middle" transform="rotate(-90 25 104)">A slot/plate</text>
    <text x="64" y="104" class="small" text-anchor="middle" transform="rotate(-90 64 104)">B slot/plate</text>
    <text x="139" y="102" class="tiny" text-anchor="middle" transform="rotate(-90 139 102)">Rear 12</text>
    <text x="72.5" y="202" text-anchor="middle" class="small">P2/P4 joint by maker proposal</text>
  </g>
  <line x1="229" y1="45" x2="316" y2="45" class="dim"/><text x="272.5" y="43" text-anchor="middle" class="label">Ref. overall 145</text>
  <line x1="236.2" y1="176" x2="308.8" y2="176" class="dim"/><text x="272.5" y="181" text-anchor="middle" class="label">Body depth 121</text>
  <text x="222" y="189" class="small">Front to back: walnut frame 9 + PC 3 + body 121 + rear cover 12 = 145</text>
  <text x="222" y="194" class="small">Grooves from front face: A 18.5–27.5, B 59.5–68.5 (9 wide)</text>

  <!-- Top plan -->
  <text x="19" y="201" class="head">C  TOP VIEW (envelope and walls)</text>
  <g transform="translate(25 208) scale(.45)">
    <rect x="0" y="0" width="270" height="145" class="outline"/>
    <rect x="0" y="0" width="270" height="9" class="wood"/>
    <rect x="0" y="9" width="270" height="3" class="glass"/>
    <rect x="0" y="12" width="270" height="121" class="ply"/>
    <rect x="0" y="133" width="270" height="12" class="ply"/>
    <line x1="12" y1="12" x2="258" y2="12" class="fine" stroke-dasharray="2 1"/>
    <line x1="12" y1="133" x2="258" y2="133" class="fine" stroke-dasharray="2 1"/>
    <text x="135" y="76" text-anchor="middle" class="label">Internal width 246</text>
    <text x="135" y="84" text-anchor="middle" class="small">Capture plates in grooves; assemble four walls around plates.</text>
  </g>
  <line x1="25" y1="205" x2="146.5" y2="205" class="dim"/><text x="85.75" y="203" text-anchor="middle" class="label">Ref. overall 270</text>
  <line x1="19" y1="208" x2="19" y2="273.25" class="dim"/><text x="15" y="240.6" transform="rotate(-90 15 240.6)" text-anchor="middle" class="label">Ref. overall 145</text>

  <!-- Groove detail -->
  <text x="222" y="207" class="head">D  SUPPORT SLOT SECTION (schematic)</text>
  <g transform="translate(235 222)">
    <rect x="0" y="0" width="56" height="28" class="ply"/>
    <rect x="0" y="9.5" width="4" height="9" fill="#fff" stroke="#388196" stroke-width=".45"/>
    <rect x="0" y="10" width="3" height="8" fill="#77b8c0" fill-opacity=".75" stroke="#388196" stroke-width=".45"/>
    <text x="29" y="16" class="small" text-anchor="middle">Wall</text>
    <text x="1.5" y="26" class="tiny" text-anchor="middle">Engagement 3</text>
    <line x1="0" y1="5" x2="4" y2="5" class="dim"/><text x="2" y="3.5" text-anchor="middle" class="tiny">Depth 4</text>
    <line x1="8" y1="9.5" x2="8" y2="18.5" class="dim"/><text x="11" y="15" class="tiny">Width 9</text>
  </g>
  <text x="305" y="228" class="small">Clear PC plate: 8 thick</text>
  <text x="305" y="234" class="small">Slot: 9 wide × 4 deep</text>
  <text x="305" y="240" class="small">PET shim after fit test</text>
  <text x="222" y="258" class="small">Clear opening 246×181</text>
  <text x="222" y="263" class="small">Support plates: 2 × 252×187×8</text>
  <text x="222" y="268" class="small">Plate engagement in each wall: 3mm</text>

  <rect x="18" y="274" width="385" height="9" class="note"/>
  <text x="22" y="280" class="tiny">OPEN: corner joints, removable retainers, walnut grade/finish, cable opening, ornament. Ask maker to quote and propose.</text>
  <text x="402" y="286" text-anchor="end" class="tiny">Drawing A01 | 2026-10-22 | NTS; stated dimensions govern</text>
</svg>
