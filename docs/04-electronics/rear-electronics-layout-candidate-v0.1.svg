<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
  <title id="title">Forest Guardian 背面補助電装配置候補 v0.1</title>
  <desc id="desc">着脱式背面カバーの内側配置候補。TMC2209位置の周囲に補助電装の候補域を示す。3.4C基板の背面からこの面まで131mm。</desc>
  <defs>
    <style>
      text { font-family: sans-serif; fill: #27313a; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 13px; fill: #58636d; }
      .label { font-size: 13px; font-weight: 600; }
      .small { font-size: 11px; fill: #46515b; }
      .dim { font-size: 12px; fill: #59636b; }
      .case { fill: #f7f4ef; stroke: #6f5b49; stroke-width: 2; }
      .usable { fill: none; stroke: #ad9b88; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .known { fill: #d9e7ef; stroke: #54788d; stroke-width: 1.5; }
      .driver { fill: #e5d9f0; stroke: #745493; stroke-width: 1.5; }
      .reserve { fill: #fff1ce; stroke: #b78625; stroke-width: 2; stroke-dasharray: 8 5; }
      .access { fill: #e8efdb; stroke: #718957; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .tray { fill: none; stroke: #356e4f; stroke-width: 2; stroke-dasharray: 5 3; }
      .risk { fill: #f6dddd; stroke: #aa5959; stroke-width: 1.5; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1040" height="620" fill="#ffffff"/>
  <text x="28" y="38" class="title">背面補助電装の配置候補 v0.1</text>
  <text x="28" y="61" class="sub">着脱式背面カバーの内側。3.4C基板の背面からこの面まで名目131mm。</text>

  <!-- Coordinates: case origin at center; 2 px/mm. Reference inner face 246 x 181 mm. -->
  <rect x="79" y="169" width="492" height="362" rx="3" class="case"/>
  <rect x="79" y="169" width="492" height="362" rx="3" class="usable"/>
  <text x="79" y="151" class="dim">内面: 246×181mm（ケース見積基準v0.3）</text>
  <text x="79" y="550" class="small">左=X- / 右=X+   下=Y- / 上=Y+   原点=ケース・3.4C中心</text>

  <!-- One 230x120mm PC tray spans the lower service zones; module outlines remain adjustable. -->
  <rect x="95" y="280" width="460" height="240" rx="5" class="tray"/>
  <text x="325" y="274" class="small" text-anchor="middle">PCサービス板 230×120mm（取付穴は現物配置で加工）</text>
  <!-- DFR0758/DFR1015 module and wiring reservation only; DFR0758 board outline/mount holes unpublished. -->
  <rect x="89" y="280" width="250" height="240" rx="7" class="reserve"/>
  <text x="118" y="311" class="label">DFR0758 / DFR1015</text>
  <text x="106" y="332" class="small">電源・配線予約: 125×120mm</text>
  <text x="106" y="351" class="small">DFR0758外形/穴は未公表</text>
  <text x="106" y="370" class="small">調整式キャリアで固定</text>

  <!-- Known module outlines. Locations are envelope centers, not mounting-hole coordinates. -->
  <rect x="128.5" y="213.8" width="49" height="40.4" rx="3" class="known"/>
  <text x="133" y="231" class="label">HUSB238</text>
  <text x="133" y="246" class="small">24.5×20.2mm</text>
  <text x="130" y="270" class="small">(-86, +58)</text>

  <rect x="129" y="175" width="48" height="38" rx="4" class="known"/>
  <text x="133" y="191" class="small">Neutrik</text>
  <text x="133" y="205" class="small">USB-C PD</text>

  <rect x="211.2" y="213.7" width="35.6" height="40.6" rx="3" class="known"/>
  <text x="213" y="231" class="label">#2851 5V</text>
  <text x="213" y="246" class="small">17.8×20.3mm</text>
  <text x="211" y="270" class="small">(-48, +58)</text>

  <rect x="472" y="232.4" width="46" height="35.2" rx="3" class="known"/>
  <text x="476" y="249" class="label">DS3231</text>
  <text x="476" y="263" class="small">23 x 17.6</text>
  <text x="472" y="287" class="small">(+85, +50)</text>

  <rect x="368.4" y="189.9" width="53.2" height="48.2" rx="3" class="driver"/>
  <text x="373" y="208" class="label">TMC2209</text>
  <text x="373" y="224" class="small">26.6 x 24.1</text>
  <text x="373" y="256" class="small">(+35, +68)</text>

  <!-- Projected motor body; depth-separated from back panel. -->
  <rect x="305" y="194" width="40" height="40" rx="2" class="risk"/>
  <text x="309" y="212" class="small">NEMA-8</text>
  <text x="309" y="226" class="small">projection</text>

  <!-- Shared service zone x=+15..+115, y=-85..+35. Two five-way distribution blocks and three inline fuses. -->
  <rect x="355" y="280" width="200" height="240" rx="4" class="access"/>
  <rect x="365" y="290" width="70" height="105.6" rx="3" fill="#dce7cd" stroke="#718957" stroke-width="1.5"/>
  <rect x="440" y="290" width="70" height="105.6" rx="3" fill="#dce7cd" stroke="#718957" stroke-width="1.5"/>
  <text x="400" y="337" class="small" text-anchor="middle">W1</text>
  <text x="400" y="352" class="small" text-anchor="middle">221-415/505</text>
  <text x="400" y="380" class="tiny" text-anchor="middle">35 x 52.8</text>
  <text x="475" y="337" class="small" text-anchor="middle">W2</text>
  <text x="475" y="352" class="small" text-anchor="middle">221-415/505</text>
  <text x="475" y="380" class="tiny" text-anchor="middle">35 x 52.8</text>
  <rect x="365" y="410" width="175" height="96" rx="4" class="risk"/>
  <text x="372" y="430" class="small">F1 3A PD / F2 2A motor</text>
  <text x="372" y="451" class="small">F3 2A LED</text>
  <text x="372" y="474" class="small">Amon 3367 inline holders ×3</text>
  <text x="372" y="494" class="small">cable tie slots on tray</text>

  <text x="631" y="116" class="label">凡例</text>
  <rect x="631" y="131" width="16" height="16" rx="2" class="known"/>
  <text x="657" y="144" class="small">公開外形がある基板の位置候補</text>
  <rect x="631" y="158" width="16" height="16" rx="2" class="driver"/>
  <text x="657" y="171" class="small">既存CAD位置のモータードライバー</text>
  <rect x="631" y="185" width="16" height="16" rx="2" class="reserve"/>
  <text x="657" y="198" class="small">電源モジュールと作業予約域</text>
  <rect x="631" y="212" width="16" height="16" rx="2" class="access"/>
  <text x="657" y="225" class="small">WAGO 5極端子2個のサービス域</text>
  <rect x="631" y="239" width="16" height="16" rx="2" class="risk"/>
  <text x="657" y="252" class="small">未選定部品域または奥行き投影</text>

  <text x="631" y="296" class="label">配置候補</text>
  <text x="631" y="320" class="small">HUSB238 #5807: X-86, Y+58</text>
  <text x="631" y="340" class="small">Pololu #2851: X-48, Y+58</text>
  <text x="631" y="360" class="small">DS3231 #3013: X+85, Y+50</text>
  <text x="631" y="380" class="small">TMC2209 #6121: X+35, Y+68</text>
  <text x="631" y="400" class="small">WAGO 221-415 / 221-505 ×2</text>
  <text x="631" y="420" class="small">Amon 3367 ×3 / MINI 2・3A</text>
  <text x="631" y="440" class="small">Neutrik NAUSBC-5G-FL10</text>

  <text x="631" y="474" class="label">組立図へ反映する項目</text>
  <text x="631" y="498" class="small">1. DFR0758調整キャリア</text>
  <text x="631" y="518" class="small">2. 配線切断長と固定点</text>
  <text x="631" y="538" class="small">3. 端子/ヒューズ交換空間</text>
  <text x="631" y="558" class="small">4. ケーブル挟み込み確認</text>
  <text x="631" y="578" class="small">5. 全負荷・閉箱温度受入</text>

  <text x="28" y="580" class="sub">単位mm。位置は部品中心候補で、固定穴位置ではありません。</text>
  <text x="28" y="602" class="sub">USB-C口・スイッチ穴はカタログ値をケース案へ転記。ケース外形270×205×172mmは見積図v0.3の基準値です。</text>
</svg>
