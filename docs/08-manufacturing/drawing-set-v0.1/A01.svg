<text x="97.000" y="925.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">6 × 65軸に歯車2個、ギア側POM W2枚を入れる。カラーなし。</text>
<text x="97.000" y="951.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">A00とB00の穴を同軸に保ち、両板のブッシュへ通す。</text>
<text x="97.000" y="977.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">継手の6mm側へ7mm入れ、軸方向位置をD05へ合わせる。</text>
