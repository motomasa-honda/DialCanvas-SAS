<text x="872.000" y="925.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">歯車・カラーを樹脂板へ押し付けず、擦れない状態に調整。</text>
<text x="872.000" y="951.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">付属M4 × 4止めねじを使い、歯車と軸へ合いマークを付ける。</text>
<text x="872.000" y="977.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">両列を手回しし、滑り・噛み込み・板割れの有無を確認。</text>
