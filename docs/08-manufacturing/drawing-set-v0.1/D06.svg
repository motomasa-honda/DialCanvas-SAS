<text x="58.000" y="118.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="34" font-weight="600" text-anchor="start" fill="#23383d">D06   表示器キャリア・固定スタック</text>
<text x="58.000" y="153.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#607479">基板外周M4穴 75 × 78.5 / 4本腕の中央は開放 / 支持板Aのアンカーへ接続</text>
