<rect x="920.000" y="235.000" width="680.000" height="260.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
<rect x="920.000" y="235.000" width="6.000" height="260.000" fill="#327e87" stroke="none" stroke-width="1"/>
<text x="942.000" y="270.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#327e87">キャリアの名目寸法</text>
<text x="942.000" y="305.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">透明PC 3厚。190 × 190素材から4本腕を切出し（4本で1組）。</text>
<text x="942.000" y="331.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">腕幅18。M4側: 中心X=±37.50 / Y=±39.25、穴 Ø4.5。</text>
<text x="942.000" y="357.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">M3側: 中心X/Y=±80、穴 Ø3.4。外形最大±89。</text>
<text x="942.000" y="383.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">外周の基板固定座へ接続し、中央の部品・端子域は開ける。</text>
<rect x="920.000" y="530.000" width="680.000" height="195.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
<rect x="920.000" y="530.000" width="6.000" height="195.000" fill="#327e87" stroke="none" stroke-width="1"/>
<text x="942.000" y="565.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#327e87">基板側: M4 × 8 / 4本</text>
<text x="942.000" y="600.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">ねじ頭 → PC 3 → POM絶縁スペーサ2 → 基板M4取付座。</text>
<text x="942.000" y="626.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">公称掛かり = 8 - 3 - 2 = 3。底付きと掛かりは組立時に確認。</text>
<text x="942.000" y="652.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">M4ねじへ別座金を追加すると掛かりが減るため追加しない。</text>
<rect x="920.000" y="755.000" width="680.000" height="205.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
<rect x="920.000" y="755.000" width="6.000" height="205.000" fill="#327e87" stroke="none" stroke-width="1"/>
<text x="942.000" y="790.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="22" font-weight="600" text-anchor="start" fill="#327e87">支持板側: M3 × 25 / 4組</text>
<text x="942.000" y="825.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">PCキャリア3 → スペーサ合計7 → 支持板A 8。</text>
<text x="942.000" y="851.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">7mmは6mm POMスペーサ + 1mm座金。外側はM3平座金と緩み止めナット。</text>
<text x="942.000" y="877.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">PCを割らない手締め。根拠のない締付トルクは指定しない。</text>
<text x="140.000" y="1070.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#23383d">前後: 基板 z=1.5…17 / 2mmスペーサ / PCキャリア19…22 / 7mm支持 / A板29…37。</text>
</svg>
