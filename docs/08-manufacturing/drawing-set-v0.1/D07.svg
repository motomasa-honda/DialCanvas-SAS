<text x="1032.000" y="870.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">+15V / GNDの221-415を混同しない。両方にラベルを付ける。</text>
<text x="1032.000" y="896.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">カバー側と本体側の線を別の結束点で保持し、開閉余長を残す。</text>
<text x="1032.000" y="922.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">モーター後方7mmは線の曲げ成立を保証する値ではない。</text>
