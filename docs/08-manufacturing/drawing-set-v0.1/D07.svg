<text x="245.000" y="668.500" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#23383d">結束保持 / スロットは現物合わせ</text>
<text x="611.000" y="791.500" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">ヒューズリード3枝</text>
<text x="611.000" y="823.500" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#23383d">サービス板へ別々に結束</text>
<text x="140.000" y="980.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">サービス板: 230 × 120 × 3 / 中心 (0,-25) / 板内の固定穴中心: X=±105、Y=±50。</text>
<text x="140.000" y="1010.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">板の4穴のみ Ø3.5。P4木部へは位置を写し、実材・ねじに合う下穴を加工する。</text>
<rect x="1010.000" y="245.000" width="590.000" height="235.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
