<text x="1032.000" y="315.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">HUSB238 / RTC / TMC: M2.5を使用。点数は2 / 2 / 4。</text>
<text x="1032.000" y="341.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">#2851: M2 × 12ねじ2本、M2ナット、3mmナイロンスペーサ。</text>
<text x="1032.000" y="367.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">WAGO取付台: 各2点、計4本のM3ねじ・座金・ナット。</text>
<rect x="1010.000" y="510.000" width="590.000" height="260.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
