<text x="1032.000" y="580.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">小型PC絶縁パッド4枚の外形、基板穴位置、P4への固定位置。</text>
<text x="1032.000" y="606.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">M2.5 / WAGO M3のねじ長さ、DFR0758の結束スロット。</text>
<text x="1032.000" y="632.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">P4の下穴径・深さは指定しない。板・パッドを置いて転記する。</text>
<text x="1032.000" y="658.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#23383d">各パッドは木ねじ3.1 × 12を2本、サービス板は4本で固定。</text>
<rect x="1010.000" y="800.000" width="590.000" height="245.000" fill="#eaf3f3" stroke="#cfdbdc" stroke-width="1"/>
<rect x="1010.000" y="800.000" width="6.000" height="245.000" fill="#327e87" stroke="none" stroke-width="1"/>
