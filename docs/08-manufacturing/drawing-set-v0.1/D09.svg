<text x="70.000" y="1070.000" font-family="Noto Sans JP,Noto Sans CJK JP,sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#23383d">初期駆動: MS1/MS2開放で1/8、SPRD開放でStealthChop、0.30A RMS/相を評価開始点とする。</text>
